# Each check is defined ONCE, in package.json (`lint`, `typecheck`, `test`);
# this file only chooses how to group them into jobs. `npm run verify` runs the
# same three locally, so green verify ⇒ green CI. The e2e suite is separate:
# it needs a seeded DB and a running server.
name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test -- --ci --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://fake:fake@localhost:5432/fake'
          DIRECT_URL: 'postgresql://fake:fake@localhost:5432/fake'
          # Not a real secret: page-data collection imports auth/constants,
          # whose production fail-fast requires this to be set (>=32 chars).
          SESSION_SECRET: 'ci-build-only-dummy-0123456789abcdef'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Deliberately NO `needs:`. This job builds nothing from the Build job — it
    # serves the app with `npm run dev` (see playwright.config.ts webServer), so
    # waiting for Build was a dependency in the graph that did not exist in
    # reality. It cost the full lint+unit+build chain (223s) on the critical path
    # of the longest job in the pipeline. Every job here is still a required
    # check; they just no longer queue behind each other.
    # The trade-off, stated: a PR that fails lint now also burns the e2e minutes
    # instead of being cut off early. That is the price of getting all four
    # verdicts at once instead of in sequence.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aoz_test
          POSTGRES_PASSWORD: aoz_test
          POSTGRES_DB: aoz_housing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aoz_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Initialize database schema
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'
          DIRECT_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'

      # Through the npm scripts, never `npx ts-node prisma/…` directly: the
      # seed imports the product's compatibility algorithm by its `@/` alias,
      # and only the scripts carry `-r tsconfig-paths/register`. Invoking
      # ts-node here by hand was a second definition of "how to seed", and it
      # broke the moment the seed stopped re-implementing the algorithm.
      # Guarded by src/lib/__tests__/scoring-ssot.test.ts.
      - name: Seed E2E data
        run: |
          npm run prisma:seed
          npm run prisma:seed:admin
        env:
          DATABASE_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'
          DIRECT_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'
          DIRECT_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'
          SESSION_SECRET: 'ci-test-secret-not-for-production'
          STAFF_INVITE_CODE: '0000'

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
