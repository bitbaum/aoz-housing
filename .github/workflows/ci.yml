name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: Verify (lint, typecheck, unit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # SSOT: identical to `npm run verify` run locally (lint + typecheck +
      # unit tests with coverage). Jest auto-enables CI mode via CI=true.
      - name: Verify
        run: npm run verify

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake"
          # Not a real secret: page-data collection imports auth/constants,
          # whose production fail-fast requires this to be set (>=32 chars).
          SESSION_SECRET: "ci-build-only-dummy-0123456789abcdef"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aoz_test
          POSTGRES_PASSWORD: aoz_test
          POSTGRES_DB: aoz_housing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aoz_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Initialize database schema
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test"
          DIRECT_URL: "postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test"

      - name: Seed E2E data
        run: |
          npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts
          npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed-admin.ts
        env:
          DATABASE_URL: "postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test"
          DIRECT_URL: "postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: "postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test"
          DIRECT_URL: "postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test"
          SESSION_SECRET: "ci-test-secret-not-for-production"
          STAFF_INVITE_CODE: "0000"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
